<!DOCTYPE html>
<!-- Práctica 2 - Tienda Online | Autora: Lucía Pardo -->
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tienda Online · Panel</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Cabecera: dirección de la API (modificable para probar contra otro equipo) -->
  <header class="cabecera">
    <div class="marca">
      <span class="logo">TO</span>
      <div>
        <h1>Tienda Online</h1>
        <p>Frontend que consume la API REST (FastAPI)</p>
      </div>
    </div>
    <form id="form-api" class="conexion">
      <label for="api-url">API</label>
      <input id="api-url" type="text" placeholder="http://localhost:8000" spellcheck="false">
      <button type="submit" class="btn btn-sec">Conectar</button>
      <span id="estado-api" class="estado" title="Estado de la conexión">sin comprobar</span>
    </form>
  </header>

  <nav class="pestanas" role="tablist">
    <button class="pestana activa" data-panel="panel-productos">Productos</button>
    <button class="pestana" data-panel="panel-usuarios">Usuarios</button>
    <button class="pestana" data-panel="panel-pedidos">Pedidos</button>
  </nav>

  <main>
    <!-- ============================ PRODUCTOS ============================ -->
    <section id="panel-productos" class="panel activo">
      <div class="rejilla">
        <form id="form-producto" class="tarjeta">
          <h2>Nuevo producto</h2>
          <label>Tipo
            <select name="tipo" id="producto-tipo">
              <option value="generico">Genérico</option>
              <option value="electronico">Electrónico</option>
              <option value="ropa">Ropa</option>
            </select>
          </label>
          <label>Nombre <input name="nombre" required maxlength="100"></label>
          <div class="fila">
            <label>Precio (€) <input name="precio" type="number" step="0.01" min="0.01" required></label>
            <label>Stock <input name="stock" type="number" step="1" min="0" required></label>
          </div>
          <div class="extra" data-tipo="electronico" hidden>
            <label>Meses de garantía <input name="meses_garantia" type="number" min="0" step="1"></label>
          </div>
          <div class="extra fila" data-tipo="ropa" hidden>
            <label>Talla <input name="talla" maxlength="10" placeholder="S, M, L, 42..."></label>
            <label>Color <input name="color" maxlength="30"></label>
          </div>
          <button type="submit" class="btn">Crear producto</button>
        </form>

        <div class="tarjeta ancha">
          <div class="titulo-tarjeta">
            <h2>Catálogo</h2>
            <button class="btn btn-sec btn-peq" data-recargar="productos">Recargar</button>
          </div>
          <div class="tabla-scroll">
            <table>
              <thead><tr><th>ID</th><th>Nombre</th><th>Tipo</th><th>Detalles</th><th class="num">Precio</th><th class="num">Stock</th><th></th></tr></thead>
              <tbody id="tabla-productos"></tbody>
            </table>
          </div>
        </div>
      </div>
    </section>

    <!-- ============================ USUARIOS ============================= -->
    <section id="panel-usuarios" class="panel">
      <div class="rejilla">
        <form id="form-usuario" class="tarjeta">
          <h2>Nuevo usuario</h2>
          <label>Nombre <input name="nombre" required maxlength="100"></label>
          <label>Email <input name="email" type="email" required></label>
          <label>Tipo
            <select name="tipo" id="usuario-tipo">
              <option value="cliente">Cliente</option>
              <option value="admin">Administrador</option>
            </select>
          </label>
          <label id="campo-direccion">Dirección postal <input name="direccion_postal" maxlength="200"></label>
          <button type="submit" class="btn">Crear usuario</button>
        </form>

        <div class="tarjeta ancha">
          <div class="titulo-tarjeta">
            <h2>Usuarios registrados</h2>
            <button class="btn btn-sec btn-peq" data-recargar="usuarios">Recargar</button>
          </div>
          <div class="tabla-scroll">
            <table>
              <thead><tr><th>ID</th><th>Nombre</th><th>Email</th><th>Rol</th><th></th></tr></thead>
              <tbody id="tabla-usuarios"></tbody>
            </table>
          </div>
        </div>
      </div>
    </section>

    <!-- ============================= PEDIDOS ============================= -->
    <section id="panel-pedidos" class="panel">
      <div class="rejilla">
        <form id="form-pedido" class="tarjeta">
          <h2>Nuevo pedido</h2>
          <label>Cliente <select name="cliente_id" id="pedido-cliente" required></select></label>
          <div class="fila linea-nueva">
            <label class="crece">Producto <select id="pedido-producto"></select></label>
            <label class="corto">Cant. <input id="pedido-cantidad" type="number" min="1" value="1"></label>
            <button type="button" id="btn-anadir-linea" class="btn btn-sec">Añadir</button>
          </div>
          <ul id="lineas-pedido" class="lineas"></ul>
          <p class="total">Total estimado: <strong id="total-pedido">0,00 €</strong></p>
          <button type="submit" class="btn">Realizar pedido</button>
        </form>

        <div class="tarjeta ancha">
          <div class="titulo-tarjeta">
            <h2>Pedidos de un usuario</h2>
          </div>
          <div class="fila">
            <label class="crece">Usuario <select id="consulta-usuario"></select></label>
            <button type="button" id="btn-ver-pedidos" class="btn btn-sec alinear-abajo">Ver pedidos</button>
          </div>
          <div id="lista-pedidos" class="lista-pedidos"></div>
        </div>
      </div>
    </section>
  </main>

  <div id="avisos" class="avisos" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
